<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jump Marshie Jump!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --space-navy:#0b1230;
    --space-navy-deep:#060a1e;
    --mars-orange:#e8562c;
    --mars-orange-dark:#c23f1c;
    --star-yellow:#ffd23f;
    --marshie-green:#3fa34d;
    --marshie-green-dark:#2c7a38;
    --lavender:#8b7fd6;
    --panel:#141b3d;
    --cream:#fff8ec;
    --success:#4cc98a;
    --danger:#ff5f6d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--space-navy-deep);
    font-family:'Nunito',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }
  .display{font-family:'Baloo 2',cursive;}
  #app{
    position:relative;
    width:100%; height:100%;
    max-width:1100px; max-height:720px;
    margin:0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  #stage{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    max-height:96vh;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.55), 0 0 0 6px #1b234d inset;
    background:var(--space-navy);
  }
  canvas{
    display:block;
    width:100%; height:100%;
  }

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:4% 6%;
    background:radial-gradient(ellipse at 50% 20%, rgba(20,27,61,0.55), rgba(6,10,30,0.92) 70%);
    color:var(--cream);
    gap:clamp(8px,1.6vh,18px);
  }
  .overlay.hidden{ display:none; }

  .title-lockup{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    margin-bottom:clamp(4px,1vh,10px);
  }
  .title-lockup h1{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(28px, 5.4vw, 56px);
    margin:0;
    color:var(--star-yellow);
    text-shadow: 0 4px 0 var(--mars-orange-dark), 0 8px 18px rgba(0,0,0,0.5);
    letter-spacing:0.5px;
    line-height:1;
  }
  .title-lockup .sub{
    font-size:clamp(13px,1.9vw,18px);
    color:#c9cff7;
    font-weight:700;
  }

  #marshieHero{
    width:clamp(90px,16vw,190px);
    filter:drop-shadow(0 12px 18px rgba(0,0,0,0.5));
    animation:heroFloat 2.6s ease-in-out infinite;
  }
  @keyframes heroFloat{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-10px) rotate(2deg); }
  }

  .age-row{
    display:flex; gap:clamp(12px,2.4vw,26px);
    flex-wrap:wrap; justify-content:center;
    margin-top:clamp(6px,1.2vh,14px);
  }
  .age-card{
    width:clamp(130px,22vw,220px);
    padding:clamp(12px,1.8vh,20px) clamp(10px,1.5vw,16px);
    border-radius:20px;
    border:none;
    cursor:pointer;
    font-family:'Baloo 2',cursive;
    color:var(--cream);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 8px 0 rgba(0,0,0,0.28), 0 14px 24px rgba(0,0,0,0.35);
  }
  .age-card:active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,0.28); }
  .age-card.little{ background:linear-gradient(160deg,#5fd0a4,var(--success)); }
  .age-card.big{ background:linear-gradient(160deg,#6f7fe8,var(--lavender)); }
  .age-card .emoji{ font-size:clamp(26px,4.4vw,42px); line-height:1; }
  .age-card .age-title{ font-size:clamp(17px,2.6vw,24px); font-weight:700; }
  .age-card .age-desc{ font-family:'Nunito',sans-serif; font-size:clamp(11px,1.5vw,13px); font-weight:600; opacity:0.92; }

  .btn{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    border:none;
    border-radius:16px;
    padding:12px 26px;
    font-size:clamp(15px,2.1vw,19px);
    cursor:pointer;
    color:var(--cream);
    background:linear-gradient(160deg,#ff8a5c,var(--mars-orange));
    box-shadow:0 6px 0 var(--mars-orange-dark), 0 10px 18px rgba(0,0,0,0.35);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:active{ transform:translateY(5px); box-shadow:0 1px 0 var(--mars-orange-dark); }
  .btn.secondary{
    background:linear-gradient(160deg,#7c8ae6,var(--lavender));
    box-shadow:0 6px 0 #5b4fb0, 0 10px 18px rgba(0,0,0,0.3);
  }
  .btn.secondary:active{ box-shadow:0 1px 0 #5b4fb0; }
  .btn-row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  .hint{ font-size:clamp(11px,1.6vw,14px); color:#a9b0e0; font-weight:700; margin-top:2px; }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    pointer-events:none;
    z-index:5;
  }
  #hud.hidden{ display:none; }
  #progressWrap{
    flex:1;
    display:flex; align-items:center; gap:6px;
    background:rgba(6,10,30,0.55);
    border-radius:999px;
    padding:6px 12px;
    margin:0 10px;
    backdrop-filter:blur(2px);
    overflow:hidden;
  }
  .pip{
    width:clamp(10px,1.6vw,16px); height:clamp(10px,1.6vw,16px);
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:2px solid rgba(255,255,255,0.28);
    flex:0 0 auto;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .pip.clean{ background:var(--star-yellow); border-color:#ffedb0; box-shadow:0 0 8px rgba(255,210,63,0.8); }
  .pip.bumped{ background:var(--danger); border-color:#ffb3b8; }
  .pip.pop{ transform:scale(1.5); }

  #livesWrap, #iconBtns{
    display:flex; align-items:center; gap:6px;
    pointer-events:auto;
  }
  .heart{ font-size:clamp(16px,2.4vw,24px); filter:drop-shadow(0 2px 2px rgba(0,0,0,0.4)); }
  .icon-btn{
    width:clamp(34px,5vw,44px); height:clamp(34px,5vw,44px);
    border-radius:50%;
    border:none;
    background:rgba(6,10,30,0.6);
    color:var(--cream);
    font-size:clamp(15px,2.2vw,20px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{ transform:scale(0.9); }

  #jumpBtn{
    position:absolute;
    bottom:clamp(14px,3vh,26px);
    right:clamp(14px,3vw,26px);
    width:clamp(64px,13vw,92px); height:clamp(64px,13vw,92px);
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 35% 30%, #ffe08a, var(--star-yellow) 60%, #e0a913 100%);
    box-shadow:0 8px 0 #b9860c, 0 14px 22px rgba(0,0,0,0.4);
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(13px,2.2vw,17px);
    color:#5a3d05;
    cursor:pointer;
    z-index:6;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    line-height:1.1;
  }
  #jumpBtn.hidden{ display:none; }
  #jumpBtn:active{ transform:translateY(6px); box-shadow:0 2px 0 #b9860c; }

  #pauseOverlay .btn-row{ margin-top:6px; }

  .banner{
    font-family:'Baloo 2',cursive;
    font-size:clamp(22px,4vw,40px);
    color:var(--star-yellow);
    text-shadow:0 3px 0 var(--mars-orange-dark);
    margin:0;
  }
  .small-note{ font-size:clamp(12px,1.7vw,15px); color:#c9cff7; font-weight:700; max-width:420px; }

  .site-link{
    display:inline-block;
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(18px,3vw,28px);
    color:var(--star-yellow);
    text-decoration:underline;
    text-decoration-thickness:3px;
    text-underline-offset:5px;
    text-shadow:0 3px 0 var(--mars-orange-dark);
    cursor:pointer;
    user-select:text;
    transition:transform 0.12s ease, color 0.12s ease;
  }
  .site-link:hover, .site-link:focus-visible{ color:#fff3b8; transform:scale(1.06); outline:none; }
  .site-link-wrap{ margin:2px 0 4px; font-size:clamp(12px,1.7vw,15px); color:#c9cff7; font-weight:700; }

  #liveRegion{ position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  @media (max-width:520px){
    #stage{ border-radius:0; }
    #app{ max-width:100%; max-height:100%; }
  }
</style>
</head>

          master.connect(ctx.destination);
        }catch(e){ ctx = null; }
      }
      if(ctx && ctx.state === 'suspended'){ ctx.resume(); }
    }

    function tone(freq, t0, dur, type, peak, glideTo){
      if(!ctx || muted) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if(glideTo){ osc.frequency.exponentialRampToValueAtTime(glideTo, t0+dur); }
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peak||0.25, t0+Math.min(0.03,dur*0.3));
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      osc.connect(gain); gain.connect(master);
      osc.start(t0); osc.stop(t0+dur+0.02);
    }

    function noiseBurst(t0, dur, peakGain, bpFreqStart, bpFreqEnd, q){
      if(!ctx || muted) return;
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1); }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = q||1.0;
      bp.frequency.setValueAtTime(bpFreqStart, t0);
      bp.frequency.linearRampToValueAtTime(bpFreqEnd, t0+dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peakGain, t0+dur*0.25);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      src.connect(bp); bp.connect(g); g.connect(master);
      src.start(t0); src.stop(t0+dur+0.05);
    }

    function playJump(){
      ensureCtx(); if(!ctx) return;
      const t = ctx.currentTime;
      tone(420, t, 0.16, 'triangle', 0.22, 760);
    }

    function playCheer(){
      ensureCtx(); if(!ctx) return;
      const t = ctx.currentTime;
      noiseBurst(t, 0.55, 0.18, 900, 2200, 0.8);
      const notes = [523.25, 659.25, 783.99]; // C5 E5 G5
      notes.forEach((f,i)=> tone(f, t+i*0.06, 0.22, 'triangle', 0.2));
    }

    function playHit(){
      ensureCtx(); if(!ctx) return;
      const t = ctx.currentTime;
      tone(160, t, 0.28, 'sawtooth', 0.22, 70);
    }

    function playSoftBoing(){
      ensureCtx(); if(!ctx) return;
      const t = ctx.currentTime;
      tone(300, t, 0.18, 'sine', 0.16, 220);
      tone(220, t+0.1, 0.18, 'sine', 0.12, 260);
    }

    function playCelebration(){
      ensureCtx(); if(!ctx) return;
      const t = ctx.currentTime;
      // big crowd swell
      noiseBurst(t, 2.6, 0.24, 700, 2600, 0.6);
      noiseBurst(t+0.15, 2.2, 0.16, 1200, 3200, 0.9);
      // fanfare melody
      const melody = [523.25,659.25,783.99,1046.5, 783.99,1046.5,1318.5];
      const gaps =   [0,     0.18,  0.36,  0.54,   0.80,  0.98, 1.2 ];
      melody.forEach((f,i)=> tone(f, t+gaps[i], 0.3, 'triangle', 0.22));
      // sparkly pops for fireworks, staggered
      for(let i=0;i<6;i++){
        const pt = t + 0.4 + i*0.35 + Math.random()*0.15;
        tone(900+Math.random()*500, pt, 0.12, 'square', 0.08, 1800);
      }
    }

    function setMuted(m){
      muted = m;
      if(master){ master.gain.value = m ? 0 : 0.9; }
    }

    function unlock(){ ensureCtx(); }

    return { playJump, playCheer, playHit, playSoftBoing, playCelebration, setMuted, unlock };
  })();

  /* ============================================================
     CANVAS / SCALING
  ============================================================ */
  const canvas = document.getElementById('gameCanvas');
  const ctx2d = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const W = 960, H = 540; // logical game size
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas(){
    const rect = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // convert logical (960x540) coords to actual canvas pixels
  function withWorldTransform(fn){
    const scaleX = canvas.width / W;
    const scaleY = canvas.height / H;
    ctx2d.save();
    ctx2d.scale(scaleX, scaleY);
    fn();
    ctx2d.restore();
  }

  /* ============================================================
     GAME CONSTANTS
  ============================================================ */
  const TOTAL_OBSTACLES = 15;
  const GROUND_Y = 420;

  const PROFILES = {
    easy: {
      gravity: 0.50,
      jumpVel: -12.5,
      baseSpeed: 3.6,
      speedRamp: 0.02,
      hitboxInset: 0.42,     // very forgiving
      obstacleGapMin: 230,
      obstacleGapMax: 300,
      allowDouble: false,
      forgiving: true,       // no lives lost, always progresses
      marshieScale: 1.05
    },
    hard: {
      gravity: 0.54,
      jumpVel: -12.5,
      baseSpeed: 3.6,
      speedRamp: 0.035,
      hitboxInset: 0.28,
      obstacleGapMin: 210,
      obstacleGapMax: 285,
      allowDouble: true,
      forgiving: false,
      marshieScale: 0.95,
      startLives: 5
    }
  };

  const OBSTACLE_TYPES_EASY = ['crater','rock'];
  const OBSTACLE_TYPES_HARD = ['crater','rock','asteroid','satellite'];

  /* ============================================================
     STATE
  ============================================================ */
  const STATE = { START:'start', PLAYING:'playing', PAUSED:'paused', RETRY:'retry', CELEBRATE:'celebrate' };
  let state = STATE.START;
  let ageGroup = null;
  let profile = null;

  let marshie, obstacles, particles, stars;
  let passedCount = 0, cleanCount = 0, lives = 0, score = 0;
  let currentSpeed = 0;
  let groundScrollX = 0;
  let flashTimer = 0;
  let celebrationTimer = 0;
  let lastTime = 0;
  let rafId = null;

  /* ============================================================
     DOM REFS
  ============================================================ */
  const startOverlay = document.getElementById('startOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const retryOverlay = document.getElementById('retryOverlay');
  const celebrateOverlay = document.getElementById('celebrateOverlay');
  const hud = document.getElementById('hud');
  const jumpBtn = document.getElementById('jumpBtn');
  const progressWrap = document.getElementById('progressWrap');
  const livesWrap = document.getElementById('livesWrap');
  const muteBtn = document.getElementById('muteBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const liveRegion = document.getElementById('liveRegion');
  const celebrateScore = document.getElementById('celebrateScore');
  const celebrateTitle = document.getElementById('celebrateTitle');

  function announce(msg){ liveRegion.textContent = msg; }

  /* ============================================================
     SETUP / RESET
  ============================================================ */
  function buildProgressPips(){
    progressWrap.innerHTML = '';
    for(let i=0;i<TOTAL_OBSTACLES;i++){
      const p = document.createElement('div');
      p.className = 'pip';
      p.id = 'pip'+i;
      progressWrap.appendChild(p);
    }
  }

  function buildLives(){
    livesWrap.innerHTML = '';
    if(profile.forgiving) return;
    for(let i=0;i<lives;i++){
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = '❤️';
      h.id = 'heart'+i;
      livesWrap.appendChild(h);
    }
  }

  function makeObstacle(x, ageKey){
    const types = ageKey==='easy' ? OBSTACLE_TYPES_EASY : OBSTACLE_TYPES_HARD;
    const type = types[Math.floor(Math.random()*types.length)];
    let w=54,h=48;
    if(type==='crater'){ w=70; h=26; }
    else if(type==='rock'){ w=48; h=54; }
    else if(type==='asteroid'){ w=50; h=50; }
    else if(type==='satellite'){ w=76; h=40; }
    return {
      x, y: GROUND_Y - h, w, h, type,
      passed:false, hit:false, blink:Math.random()*Math.PI*2
    };
  }

  function generateObstacles(ageKey){
    const p = PROFILES[ageKey];
    const list = [];
    let x = W + 260;
    for(let i=0;i<TOTAL_OBSTACLES;i++){
      list.push(makeObstacle(x, ageKey));
      const gap = p.obstacleGapMin + Math.random()*(p.obstacleGapMax-p.obstacleGapMin);
      x += gap;
      // occasionally add a close double obstacle in hard mode (not on first few)
      if(p.allowDouble && i>4 && i<TOTAL_OBSTACLES-1 && Math.random()<0.12){
        i++;
        list.push(makeObstacle(x, ageKey));
        const gap2 = p.obstacleGapMin*0.55 + Math.random()*30;
        x += gap2;
      }
    }
    // trim / pad to exactly TOTAL_OBSTACLES
    return list.slice(0, TOTAL_OBSTACLES);
  }

  function makeStars(){
    const arr = [];
    for(let i=0;i<70;i++){
      arr.push({
        x: Math.random()*W, y: Math.random()*(GROUND_Y-40),
        r: 0.6+Math.random()*1.6,
        phase: Math.random()*Math.PI*2,
        speed: 0.3+Math.random()*0.6
      });
    }
    return arr;
  }

  function resetRun(){
    profile = PROFILES[ageGroup];
    marshie = {
      x: 130, y: GROUND_Y - 108, w: 78, h: 108,
      vy: 0, jumping: false, bob: 0
    };
    obstacles = generateObstacles(ageGroup);
    particles = [];
    stars = makeStars();
    passedCount = 0; cleanCount = 0; score = 0;
    lives = profile.forgiving ? Infinity : profile.startLives;
    currentSpeed = profile.baseSpeed;
    groundScrollX = 0;
    flashTimer = 0;

    buildProgressPips();
    buildLives();
  }

  /* ============================================================
     INPUT
  ============================================================ */
  function doJump(){
    if(state !== STATE.PLAYING) return;
    if(!marshie.jumping){
      marshie.vy = profile.jumpVel;
      marshie.jumping = true;
      AudioEngine.playJump();
    }
  }

  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      if(state === STATE.START){ /* no-op, must choose age */ }
      else doJump();
    }
    if(e.code === 'Escape'){ togglePause(); }
  });

  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    doJump();
  });
  jumpBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); doJump(); });

  document.querySelectorAll('.age-card').forEach(function(btn){
    btn.addEventListener('click', function(){
      AudioEngine.unlock();
      ageGroup = btn.getAttribute('data-age');
      startGame();
    });
  });

  pauseBtn.addEventListener('click', togglePause);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('menuFromPauseBtn').addEventListener('click', goToMenu);
  document.getElementById('menuFromRetryBtn').addEventListener('click', goToMenu);
  document.getElementById('menuFromCelebrateBtn').addEventListener('click', goToMenu);
  document.getElementById('retryBtn').addEventListener('click', function(){
    resetRun();
    setState(STATE.PLAYING);
  });
  document.getElementById('playAgainBtn').addEventListener('click', function(){
    resetRun();
    setState(STATE.PLAYING);
  });

  muteBtn.addEventListener('click', function(){
    const willMute = muteBtn.textContent.trim() !== '🔇';
    AudioEngine.setMuted(willMute);
    muteBtn.textContent = willMute ? '🔇' : '🔊';
  });

  function togglePause(){
    if(state === STATE.PLAYING){ setState(STATE.PAUSED); }
    else if(state === STATE.PAUSED){ setState(STATE.PLAYING); }
  }

  function goToMenu(){
    ageGroup = null;
    setState(STATE.START);
  }

  /* ============================================================
     STATE TRANSITIONS
  ============================================================ */
  function setState(next){
    state = next;
    startOverlay.classList.toggle('hidden', state !== STATE.START);
    pauseOverlay.classList.toggle('hidden', state !== STATE.PAUSED);
    retryOverlay.classList.toggle('hidden', state !== STATE.RETRY);
    celebrateOverlay.classList.toggle('hidden', state !== STATE.CELEBRATE);
    hud.classList.toggle('hidden', !(state === STATE.PLAYING || state === STATE.PAUSED));
    jumpBtn.classList.toggle('hidden', !(state === STATE.PLAYING));
  }

  function startGame(){
    resetRun();
    setState(STATE.PLAYING);
    announce('Game started for ' + (ageGroup==='easy' ? 'Little Explorers' : 'Space Rangers'));
  }

  function triggerRetry(){
    setState(STATE.RETRY);
  }

  function triggerCelebration(){
    setState(STATE.CELEBRATE);
    celebrationTimer = 0;
    AudioEngine.playCelebration();
    spawnFireworksBatch();
    if(ageGroup === 'hard'){
      celebrateScore.textContent = 'You cleared all 15 obstacles with a score of ' + score + '! 🎉';
    } else {
      celebrateScore.textContent = 'You helped Marshie jump all the way home! 🎉';
    }
    celebrateTitle.textContent = 'Marshie is home on Mars!';
  }

  /* ============================================================
     PARTICLES (confetti + fireworks)
  ============================================================ */
  const CONFETTI_COLORS = ['#ffd23f','#ff8a5c','#8b7fd6','#4cc98a','#ff5f6d','#6fd3ff'];

  function spawnConfettiBurst(x,y,count){
    count = count || 14;
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const speed = 2+Math.random()*3.5;
      particles.push({
        x, y,
        vx: Math.cos(ang)*speed,
        vy: Math.sin(ang)*speed - 2,
        g: 0.15,
        life: 0, maxLife: 40+Math.random()*20,
        size: 4+Math.random()*4,
        color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
        rot: Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3
      });
    }
  }

  function spawnFireworksBatch(){
    let bursts = 0;
    const maxBursts = 9;
    const interval = setInterval(function(){
      if(bursts >= maxBursts || state !== STATE.CELEBRATE){ clearInterval(interval); return; }
      const x = 120 + Math.random()*(W-240);
      const y = 80 + Math.random()*180;
      spawnConfettiBurst(x, y, 26);
      bursts++;
    }, 320);
  }

  function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vy += p.g;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      if(p.life > p.maxLife){ particles.splice(i,1); }
    }
  }

  function drawParticles(){
    particles.forEach(function(p){
      const alpha = Math.max(0, 1 - p.life/p.maxLife);
      ctx2d.save();
      ctx2d.globalAlpha = alpha;
      ctx2d.translate(p.x, p.y);
      ctx2d.rotate(p.rot);
      ctx2d.fillStyle = p.color;
      ctx2d.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx2d.restore();
    });
  }

  /* ============================================================
     COLLISION
  ============================================================ */
  function insetRect(rx,ry,rw,rh, factor){
    const dx = rw*factor/2, dy = rh*factor/2;
    return { x: rx+dx, y: ry+dy, w: rw-dx*2, h: rh-dy*2 };
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  /* ============================================================
     UPDATE
  ============================================================ */
  function updateMarshie(dt){
    marshie.vy += profile.gravity;
    marshie.y += marshie.vy;
    const restY = GROUND_Y - marshie.h;
    if(marshie.y >= restY){
      marshie.y = restY;
      marshie.vy = 0;
      marshie.jumping = false;
    }
    marshie.bob += dt*0.012;
  }

  function updateObstacles(){
    currentSpeed = profile.baseSpeed + passedCount*profile.speedRamp;
    obstacles.forEach(function(o){
      o.x -= currentSpeed;
      o.blink += 0.08;

      const mHit = insetRect(marshie.x, marshie.y, marshie.w, marshie.h, 0.30);
      const oHit = insetRect(o.x, o.y, o.w, o.h, profile.hitboxInset);

      if(!o.hit && rectsOverlap(mHit, oHit)){
        o.hit = true;
        if(profile.forgiving){
          AudioEngine.playSoftBoing();
        } else {
          lives -= 1;
          AudioEngine.playHit();
          flashTimer = 12;
          buildLives();
          if(lives <= 0){
            triggerRetry();
          }
        }
      }

      if(!o.passed && (o.x + o.w) < marshie.x){
        o.passed = true;
        passedCount++;
        if(!o.hit){
          cleanCount++;
          score += 10;
          AudioEngine.playCheer();
          spawnConfettiBurst(marshie.x+marshie.w*0.6, marshie.y+marshie.h*0.3, 14);
        }
        updatePip(passedCount-1, o.hit);
        if(passedCount >= TOTAL_OBSTACLES){
          triggerCelebration();
        }
      }
    });
  }

  function updatePip(index, wasHit){
    const el = document.getElementById('pip'+index);
    if(!el) return;
    el.classList.add(wasHit ? 'bumped' : 'clean', 'pop');
    setTimeout(function(){ el.classList.remove('pop'); }, 220);
  }

  function updateWorld(dt){
    groundScrollX -= currentSpeed;
    if(flashTimer>0) flashTimer--;
    updateParticles();
  }

  /* ============================================================
     DRAW
  ============================================================ */
  function drawBackground(){
    const g = ctx2d.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a1140');
    g.addColorStop(0.55,'#141b3d');
    g.addColorStop(1,'#1c1440');
    ctx2d.fillStyle = g;
    ctx2d.fillRect(0,0,W,H);

    // stars
    stars.forEach(function(s){
      const alpha = 0.4 + 0.6*Math.abs(Math.sin(s.phase + performance.now()*0.001*s.speed));
      ctx2d.globalAlpha = alpha;
      ctx2d.fillStyle = '#fff8ec';
      ctx2d.beginPath();
      ctx2d.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx2d.fill();
    });
    ctx2d.globalAlpha = 1;

    // Mars destination, grows as progress increases
    const growth = Math.min(1, passedCount/TOTAL_OBSTACLES);
    const marsR = 46 + growth*70;
    const marsX = W - 110 - (1-growth)*40;
    const marsY = 100 + (1-growth)*10;
    ctx2d.save();
    ctx2d.beginPath();
    ctx2d.arc(marsX, marsY, marsR, 0, Math.PI*2);
    const mg = ctx2d.createRadialGradient(marsX-marsR*0.3,marsY-marsR*0.3,marsR*0.1,marsX,marsY,marsR);
    mg.addColorStop(0,'#ff9a6a');
    mg.addColorStop(1,'#c9491f');
    ctx2d.fillStyle = mg;
    ctx2d.fill();
    ctx2d.fillStyle = 'rgba(150,50,20,0.35)';
    ctx2d.beginPath(); ctx2d.arc(marsX-marsR*0.35,marsY+marsR*0.2,marsR*0.22,0,Math.PI*2); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.arc(marsX+marsR*0.25,marsY-marsR*0.15,marsR*0.15,0,Math.PI*2); ctx2d.fill();
    ctx2d.restore();

    // distant moon/hills silhouette strip, gently parallax scrolling
    ctx2d.fillStyle = 'rgba(60,50,110,0.45)';
    const hillOffset = (groundScrollX*0.3) % 240;
    for(let x = hillOffset-240; x < W+240; x += 240){
      ctx2d.beginPath();
      ctx2d.ellipse(x+120, GROUND_Y+10, 160, 40, 0, Math.PI, 0);
      ctx2d.fill();
    }
  }

  function drawGround(){
    ctx2d.fillStyle = '#2a2350';
    ctx2d.fillRect(0, GROUND_Y, W, H-GROUND_Y);
    ctx2d.fillStyle = 'rgba(255,255,255,0.06)';
    const stripeW = 46;
    const offset = ((groundScrollX % stripeW) + stripeW) % stripeW;
    for(let x = -offset; x < W; x += stripeW){
      ctx2d.fillRect(x, GROUND_Y, stripeW*0.5, 6);
    }
    ctx2d.fillStyle = '#1b1638';
    ctx2d.fillRect(0, GROUND_Y-4, W, 4);
  }

  function drawObstacle(o){
    ctx2d.save();
    if(o.type === 'crater'){
      ctx2d.fillStyle = '#4b3f78';
      ctx2d.beginPath();
      ctx2d.ellipse(o.x+o.w/2, o.y+o.h*0.7, o.w/2, o.h/2, 0, 0, Math.PI*2);
      ctx2d.fill();
      ctx2d.strokeStyle = '#a89ee0';
      ctx2d.lineWidth = 3;
      ctx2d.beginPath();
      ctx2d.ellipse(o.x+o.w/2, o.y+o.h*0.55, o.w/2*0.85, o.h/2*0.7, 0, Math.PI, Math.PI*2);
      ctx2d.stroke();
    } else if(o.type === 'rock'){
      ctx2d.fillStyle = '#8b8bab';
      ctx2d.beginPath();
      ctx2d.moveTo(o.x, o.y+o.h);
      ctx2d.lineTo(o.x+o.w*0.15, o.y+o.h*0.25);
      ctx2d.lineTo(o.x+o.w*0.55, o.y);
      ctx2d.lineTo(o.x+o.w*0.9, o.y+o.h*0.35);
      ctx2d.lineTo(o.x+o.w, o.y+o.h);
      ctx2d.closePath();
      ctx2d.fill();
      ctx2d.fillStyle = 'rgba(255,255,255,0.18)';
      ctx2d.beginPath();
      ctx2d.moveTo(o.x+o.w*0.55, o.y);
      ctx2d.lineTo(o.x+o.w*0.9, o.y+o.h*0.35);
      ctx2d.lineTo(o.x+o.w*0.6, o.y+o.h*0.4);
      ctx2d.closePath();
      ctx2d.fill();
    } else if(o.type === 'asteroid'){
      ctx2d.fillStyle = '#9c8f7e';
      ctx2d.beginPath();
      ctx2d.arc(o.x+o.w/2, o.y+o.h/2, o.w/2, 0, Math.PI*2);
      ctx2d.fill();
      ctx2d.fillStyle = 'rgba(0,0,0,0.18)';
      ctx2d.beginPath(); ctx2d.arc(o.x+o.w*0.35,o.y+o.h*0.4,o.w*0.12,0,Math.PI*2); ctx2d.fill();
      ctx2d.beginPath(); ctx2d.arc(o.x+o.w*0.62,o.y+o.h*0.6,o.w*0.09,0,Math.PI*2); ctx2d.fill();
    } else if(o.type === 'satellite'){
      ctx2d.fillStyle = '#c7cbe0';
      ctx2d.fillRect(o.x+o.w*0.25, o.y+o.h*0.25, o.w*0.5, o.h*0.5);
      ctx2d.fillStyle = '#7c8ae6';
      ctx2d.fillRect(o.x, o.y+o.h*0.35, o.w*0.25, o.h*0.3);
      ctx2d.fillRect(o.x+o.w*0.75, o.y+o.h*0.35, o.w*0.25, o.h*0.3);
      const blinkA = 0.5+0.5*Math.sin(o.blink);
      ctx2d.globalAlpha = blinkA;
      ctx2d.fillStyle = '#ff5f6d';
      ctx2d.beginPath(); ctx2d.arc(o.x+o.w*0.5, o.y+o.h*0.25, 4, 0, Math.PI*2); ctx2d.fill();
      ctx2d.globalAlpha = 1;
    }
    ctx2d.restore();
  }

  function drawMarshie(){
    if(!marshieImg.complete || marshieImg.naturalWidth === 0) return;
    ctx2d.save();
    const bobOffset = marshie.jumping ? 0 : Math.sin(marshie.bob)*3;
    const cx = marshie.x + marshie.w/2;
    const cy = marshie.y + marshie.h/2 + bobOffset;
    ctx2d.translate(cx, cy);
    const tilt = marshie.jumping ? Math.max(-0.18, Math.min(0.05, marshie.vy*0.012)) : 0;
    ctx2d.rotate(tilt);
    const stretch = marshie.jumping ? 1.06 : 1.0;
    const squash = marshie.jumping ? 0.96 : (1 + Math.sin(marshie.bob)*0.02);
    ctx2d.drawImage(marshieImg, -marshie.w/2, -marshie.h/2*stretch, marshie.w*squash, marshie.h*stretch);
    ctx2d.restore();
  }

  function drawFlash(){
    if(flashTimer>0){
      ctx2d.fillStyle = 'rgba(255,80,80,' + (flashTimer/12*0.35) + ')';
      ctx2d.fillRect(0,0,W,H);
    }
  }

  function render(){
    ctx2d.clearRect(0,0,canvas.width, canvas.height);
    withWorldTransform(function(){
      drawBackground();
      drawGround();
      if(state===STATE.PLAYING || state===STATE.PAUSED){
        obstacles.forEach(drawObstacle);
        drawMarshie();
      }
      drawParticles();
      drawFlash();
      if(state===STATE.PAUSED){
        ctx2d.fillStyle = 'rgba(6,10,30,0.35)';
        ctx2d.fillRect(0,0,W,H);
      }
    });
  }

  /* ============================================================
     MAIN LOOP
  ============================================================ */
  function loop(ts){
    const dt = lastTime ? (ts-lastTime) : 16;
    lastTime = ts;

    if(state === STATE.PLAYING){
      updateMarshie(dt);
      updateObstacles();
      updateWorld(dt);
    } else if(state === STATE.CELEBRATE){
      updateParticles();
      celebrationTimer += dt;
    } else {
      updateParticles();
    }
    render();
    rafId = requestAnimationFrame(loop);
  }

  /* ============================================================
     INIT
  ============================================================ */
  stars = makeStars();
  particles = [];
  obstacles = [];
  marshie = { x:130, y:GROUND_Y-108, w:78, h:108, vy:0, jumping:false, bob:0 };
  setState(STATE.START);
  rafId = requestAnimationFrame(loop);

})();
</script>
</body>
